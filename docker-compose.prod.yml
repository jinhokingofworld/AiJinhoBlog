services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: aijinhoblog-app
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-deploy.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      CHROMA_URL: ${CHROMA_URL:-http://chroma:8000}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      chroma:
        condition: service_started

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    profiles:
      - release
    env_file:
      - ${DEPLOY_ENV_FILE:-deploy.env}
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: aijinhoblog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aijinhoblog}
      MYSQL_USER: ${MYSQL_USER:-aijinho}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma
    container_name: aijinhoblog-chroma
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma_data:/data

volumes:
  mysql_data:
  chroma_data:
