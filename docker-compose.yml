services:
  mysql:
    image: mysql:8.4
    container_name: aijinhoblog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aijinhoblog}
      MYSQL_USER: ${MYSQL_USER:-aijinho}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aijinho_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-password}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma
    container_name: aijinhoblog-chroma
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma_data:/data

volumes:
  mysql_data:
  chroma_data:
