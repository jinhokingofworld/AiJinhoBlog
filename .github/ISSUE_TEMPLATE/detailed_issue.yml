name: Detailed Issue
description: 실제 개발 작업 단위의 작은 이슈를 정의합니다.
title: "[Detailed] "
labels:
  - detailed-issue
body:
  - type: markdown
    attributes:
      value: |
        Detailed Issue는 실제 개발 작업 단위입니다.
        2~3개의 명확한 체크리스트가 끝나면 닫을 수 있는 크기로 유지하세요.

  - type: input
    id: parent_medium_issue
    attributes:
      label: 상위 Medium Issue
      description: 연결되는 Medium Issue 번호 또는 링크를 작성하세요.
      placeholder: 예) #24
    validations:
      required: true

  - type: dropdown
    id: work_type
    attributes:
      label: 작업 유형
      description: 가장 가까운 작업 유형을 선택하세요.
      options:
        - Feature
        - API
        - UI
        - Database
        - AI/RAG
        - MCP
        - Agent
        - Test
        - Docs
        - Refactor
        - Bugfix
        - Infra
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: 작업 내용
      description: 이번 이슈에서 할 일을 구체적으로 작성하세요.
      placeholder: 예) 회원가입 API에서 이메일 중복 확인과 비밀번호 해시 저장을 구현한다.
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: 체크리스트
      description: 2~3개의 작은 완료 항목으로 작성하세요.
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 이 이슈를 닫을 수 있는 기준을 작성하세요.
      value: |
        - [ ] 구현이 완료되었다.
        - [ ] 정상 케이스와 실패 케이스를 확인했다.
        - [ ] 필요한 경우 테스트를 추가하거나 수동 검증 결과를 남겼다.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증 방법
      description: 실행할 명령어, 테스트 파일, 수동 확인 절차를 작성하세요.
      placeholder: 예) npm test, 회원가입 화면에서 중복 이메일 입력 확인
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 문서, 코드 위치, API 명세, 디자인 링크를 작성하세요.
    validations:
      required: false
