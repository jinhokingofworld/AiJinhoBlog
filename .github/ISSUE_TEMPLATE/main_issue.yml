name: Main Issue
description: 프로젝트의 큰 기능 단위를 정의합니다.
title: "[Main] "
labels:
  - main-issue
body:
  - type: markdown
    attributes:
      value: |
        Main Issue는 프로젝트의 큰 기능 단위를 정의합니다.
        하위 Medium Issue들이 이 Main Issue에 연결됩니다.

  - type: dropdown
    id: phase
    attributes:
      label: Phase
      description: 이 이슈가 속한 프로젝트 단계를 선택하세요.
      options:
        - Phase 0. 프로젝트 기준 정리
        - Phase 1. 기본 블로그 기반 구현
        - Phase 2. AI 데이터 파이프라인 구축
        - Phase 3. RAG 기능 구현
        - Phase 4. MCP 연동
        - Phase 5. AI Agent 기능 구현
        - Phase 6. 품질 안정화 및 배포 준비
        - Future Scope
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: 목표
      description: 이 Main Issue가 달성해야 하는 목표를 작성하세요.
      placeholder: 예) 사용자가 회원가입, 로그인, 로그아웃을 할 수 있는 인증 시스템을 구현한다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함할 범위와 제외할 범위를 구분해서 작성하세요.
      value: |
        포함:
        -

        제외:
        -
    validations:
      required: true

  - type: textarea
    id: medium_issues
    attributes:
      label: 하위 Medium Issue 목록
      description: 이 Main Issue를 구성하는 중간 단위 작업을 나열하세요.
      value: |
        - [ ] Medium Issue:
        - [ ] Medium Issue:
        - [ ] Medium Issue:
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 기준
      description: 이 Main Issue가 완료되었다고 판단할 수 있는 조건을 작성하세요.
      value: |
        - [ ] 사용자가 실제 화면 또는 API를 통해 핵심 흐름을 수행할 수 있다.
        - [ ] 권한, 예외, 실패 케이스가 처리되어 있다.
        - [ ] 관련 테스트 또는 수동 검증 기록이 남아 있다.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 의존성 및 선행 조건
      description: 먼저 완료되어야 하는 이슈, 기술 결정, 외부 설정을 작성하세요.
      placeholder: 예) MySQL 로컬 환경 구성, 인증 미들웨어 구현
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 관련 문서, 결정 사항, 주의할 점을 작성하세요.
    validations:
      required: false
